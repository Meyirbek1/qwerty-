setTimeout(()=>document.querySelectorAll('.rv').forEach(e=>e.getBoundingClientRect().top<innerHeight&&e.classList.add('in')),50);
const hv=$('#hv');hv.addEventListener('error',()=>hv.parentNode.style.display='none',true);hv.play&&hv.play().catch(()=>{});
/* ---- 3D network (canvas, no libs) ---- */
const cv=$('#net'),g=cv.getContext('2d');let W,H,ang=0,mx=0,my=0,mode='idle',col=[255,255,255],tc=[255,255,255],spd=.0016,k=0;const P=[],E=[];const N=innerWidth<700?55:105;
const COL={idle:[255,255,255],busy:[170,200,255],reliable:[74,222,128],suspicious:[250,204,21],fake:[248,113,113]};
for(let i=0;i<N;i++){const u=Math.random()*2-1,a=Math.random()*6.2832,r=Math.sqrt(1-u*u);P.push([r*Math.cos(a),u,r*Math.sin(a)])}
for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const d=Math.hypot(P[i][0]-P[j][0],P[i][1]-P[j][1],P[i][2]-P[j][2]);if(d<(N>80?.5:.65))E.push([i,j])}
function setNet(m){mode=m;tc=COL[m]||COL.idle;spd=m==='busy'?.011:.0016}
function size(){const d=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*d;H=cv.height=innerHeight*d}size();addEventListener('resize',size);
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5},{passive:true});
function frame(){requestAnimationFrame(frame);if(document.hidden)return;k++;ang+=spd;for(let i=0;i<3;i++)col[i]+=(tc[i]-col[i])*.06;
g.clearRect(0,0,W,H);const s=Math.min(W,H)*.52*(1+(mode==='busy'?.05*Math.sin(k*.12):0)),cy=Math.cos(ang),sy=Math.sin(ang),rx=my*.6,cx=Math.cos(rx),sx=Math.sin(rx),ox=W*.5+mx*W*.06,oy=H*.5;
const Q=P.map(p=>{let x=p[0]*cy-p[2]*sy,z=p[0]*sy+p[2]*cy,y=p[1]*cx-z*sx;z=p[1]*sx+z*cx;const f=1/(2.6-z);return[ox+x*f*s*2.2,oy+y*f*s*2.2,z,f]});
const c=col.map(Math.round).join(',');g.lineWidth=1;
for(const[a,b]of E){const A=Q[a],B=Q[b],al=Math.max(0,(A[2]+B[2]+2)/4)*.55;g.strokeStyle=`rgba(${c},${al})`;g.beginPath();g.moveTo(A[0],A[1]);g.lineTo(B[0],B[1]);g.stroke()}
for(const q of Q){g.fillStyle=`rgba(${c},${.35+(q[2]+1)*.3})`;g.beginPath();g.arc(q[0],q[1],(1.2+q[3]*1.6)*(W>1500?1.4:1),0,6.2832);g.fill()}}
frame();
apply();route();
})();
</script>
